<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WHISPR // TERMINAL HUD</title>
  <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0B0A08">
  <meta name="description" content="Private terminal-grade chat for exactly two people">
</head>
<body>
  <div id="app-root">
    <!-- Top Status Bar -->
    <header id="status-bar">
      <div class="hud-brand">WHISPR // LINK: <span id="link-state" class="status-online">CONNECTING</span></div>
      <div class="hud-status-info">
        <span id="ping-display" class="status-dim">LAT --ms</span>
        <span id="partner-status" class="status-dim">[PARTNER: OFFLINE]</span>
        <button id="btn-fx-toggle" class="btn-fx" title="Toggle Scanline FX" aria-label="Toggle Scanlines">[FX]</button>
      </div>
    </header>

    <!-- Chat Message Log -->
    <main id="chat-log" role="log" aria-live="polite" aria-relevant="additions text"></main>

    <!-- Typing Indicator -->
    <div id="typing-indicator" aria-live="polite"></div>

    <!-- Reply / Edit Context Bar -->
    <div id="input-context-bar">
      <span id="context-label">re: ...</span>
      <button id="btn-cancel-context" class="context-cancel-btn" title="Cancel">[ESC]</button>
    </div>

    <!-- Input Bar -->
    <footer id="input-container">
      <div class="input-prompt-row">
        <span class="input-prompt-glyph">&gt;</span>
        <textarea id="message-input" rows="1" placeholder="Type message... (Enter sends, Shift+Enter newline)" aria-label="Message prompt"></textarea>
      </div>
      <div class="input-actions-row">
        <div class="input-tools-group">
          <input type="file" id="file-input-photo" accept="image/*" style="display: none;">
          <button id="btn-attach-img" class="bracket-btn" title="Send Photo">[IMG]</button>
          <button id="btn-record-voice" class="bracket-btn" title="Record Voice Note">[REC]</button>
          <button id="btn-start-call" class="bracket-btn" title="Voice/Video Call">[CALL]</button>
        </div>
        <button id="btn-send-message" class="bracket-btn bracket-btn-send" title="Send Message">[SEND]</button>
      </div>
    </footer>
  </div>

  <!-- Terminal Auth Screen Overlay -->
  <div id="auth-overlay">
    <div class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="auth-header-title">
      <div id="auth-header-title" class="auth-header">WHISPR // AUTHENTICATION</div>
      <form id="auth-form" autocomplete="off">
        <div class="auth-field">
          <label class="auth-label" for="auth-username">AUTH&gt; username</label>
          <input type="text" id="auth-username" class="auth-input" autocorrect="off" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="auth-field">
          <label class="auth-label" for="auth-password">AUTH&gt; password (min 8 chars)</label>
          <input type="password" id="auth-password" class="auth-input" required>
        </div>
        <div id="auth-error-msg" class="auth-error" aria-live="assertive"></div>
        <div class="auth-actions">
          <button type="button" id="btn-toggle-auth-mode" class="bracket-btn">[MODE: LOGIN]</button>
          <button type="submit" id="btn-auth-submit" class="bracket-btn bracket-btn-send">[ENTER]</button>
        </div>
      </form>
    </div>
  </div>

  <!-- WebRTC Call Overlay -->
  <div id="call-overlay" role="dialog" aria-modal="true" aria-labelledby="call-partner-display">
    <div class="call-panel">
      <div id="call-partner-display" class="call-title">CALL // ...</div>
      <div id="call-status-display" class="call-status-line">DIALING...</div>
      <div class="call-video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>
      <div class="call-controls">
        <button id="btn-call-mute" class="bracket-btn">[MUTE]</button>
        <button id="btn-call-cam" class="bracket-btn">[CAM]</button>
        <button id="btn-call-end" class="bracket-btn call-btn-danger">[END]</button>
      </div>
    </div>
  </div>

  <!-- Fullscreen Lightbox for Photos -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <img id="lightbox-img" src="" alt="Fullscreen image">
  </div>

  <!-- Socket.io client script -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Main ES Module entrypoint -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
