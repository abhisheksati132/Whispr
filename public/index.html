<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>tahc</title>
  <meta name="description" content="Simple, fast, private messaging in black and white." />
  <link rel="manifest" href="/manifest.json?v=6000" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=6000" />
  <link rel="apple-touch-icon" href="/icon-192.png?v=6000" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="tahc" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=6000" />
</head>
<body>

  <!-- Floating Toast Notifications Container -->
  <div id="toastContainer"></div>

  <!-- Fullscreen Media Lightbox -->
  <div id="lightbox" onclick="BestieChat.closeLightbox()">
    <img id="lightboxImg" src="" alt="Full view" />
  </div>

  <!-- ═══════════════════ AUTH / SIGN IN SCREEN ═══════════════════ -->
  <div id="login">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-icon" style="background:#000; border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center;">
          <div style="width:24px; height:24px; border-radius:50%; background:#fff;"></div>
        </div>
        <h1 class="login-title">tahc</h1>
        <p class="login-subtitle">Simple, private text messaging</p>
      </div>

      <!-- Auth Switcher -->
      <div class="auth-tabs" id="authModeToggle">
        <button type="button" class="auth-tab-btn active" id="authTabSignIn" onclick="BestieChat.switchAuthTab('signin')">Sign In</button>
        <button type="button" class="auth-tab-btn" id="authTabRegister" onclick="BestieChat.switchAuthTab('register')">Create Account</button>
      </div>

      <!-- Form -->
      <div class="login-form">
        <div class="login-field">
          <label class="login-label" for="nameInput">Username</label>
          <input id="nameInput" type="text" class="login-input" placeholder="e.g. john" maxlength="30" autocomplete="username" autocapitalize="none" />
        </div>

        <div id="nicknameField" class="login-field" style="display:none;">
          <label class="login-label" for="regNicknameInput">Your Name</label>
          <input id="regNicknameInput" type="text" class="login-input" placeholder="e.g. John Doe" maxlength="30" autocomplete="name" />
        </div>

        <div class="login-field">
          <label class="login-label" for="passwordInput">Password</label>
          <input id="passwordInput" type="password" class="login-input" placeholder="Enter password..." autocomplete="current-password" />
        </div>

        <div id="confirmPasswordField" class="login-field" style="display:none;">
          <label class="login-label" for="regPasswordConfirmInput">Confirm Password</label>
          <input id="regPasswordConfirmInput" type="password" class="login-input" placeholder="Re-enter password..." autocomplete="new-password" />
        </div>

        <!-- Hidden compat elements -->
        <input id="nicknameInput" type="hidden" />

        <div id="loginError" class="login-error" style="display:none;"></div>

        <button id="joinBtn" class="login-btn" onclick="BestieChat.joinChat()">
          <span id="joinBtnText">Enter tahc</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════ MAIN CHAT APPLICATION ═══════════════════ -->
  <div id="chat" style="display:none;">

    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebarOverlay" onclick="BestieChat.closeSidebar()"></div>

    <!-- ── LEFT SIDEBAR (CHATS & CONTACTS) ── -->
    <aside id="sidebar">
      
      <!-- Top Profile Header -->
      <div class="sidebar-header">
        <div class="sidebar-user" onclick="BestieChat.openProfile()" title="Click to view profile">
          <div id="sidebarMyAvatar" class="sidebar-avatar">Y</div>
          <div class="sidebar-user-details">
            <div id="sidebarMyName" class="sidebar-name">You</div>
            <div id="sidebarMyBio" class="sidebar-status">Online</div>
          </div>
        </div>

        <div class="sidebar-actions">
          <button type="button" class="icon-btn primary" onclick="BestieChat.openNewChatModal()" title="Start New Chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" onclick="BestieChat.openProfile()" title="My Profile">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" onclick="BestieChat.logout()" title="Log Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search Box -->
      <div class="sidebar-search-wrap">
        <div class="sidebar-search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="sidebarSearchInput" class="sidebar-search-input" type="text" placeholder="Search people or chats..." autocomplete="off" oninput="BestieChat.handleSidebarSearch(this.value)" />
          <button id="sidebarSearchClear" type="button" class="sidebar-search-clear" onclick="BestieChat.clearSidebarSearch()" style="display:none;">✕</button>
        </div>
      </div>

      <!-- Quick Filter Buttons -->
      <div class="sidebar-filters">
        <button type="button" class="filter-pill active" onclick="BestieChat.filterChatList('all', this)">All Chats</button>
        <button type="button" class="filter-pill" onclick="BestieChat.filterChatList('unread', this)">Unread</button>
        <button type="button" class="filter-pill" onclick="BestieChat.openNewChatModal()">+ New Message</button>
      </div>

      <!-- Conversations List -->
      <div id="sidebarDmList" class="sidebar-chats-list"></div>

      <!-- Hidden compat elements for legacy JS hooks -->
      <div style="display:none;">
        <div id="bestieAvatar"></div>
        <div id="bestieName"></div>
        <div id="bestieStatus"></div>
        <div id="theirFeeling"></div>
        <div id="streakBadge"></div>
        <div id="dmList"></div>
        <button id="soundBtn" onclick="BestieChat.toggleSound()"></button>
        <button id="themeToggle" onclick="BestieChat.toggleTheme()"></button>
      </div>
    </aside>

    <!-- ── RIGHT MAIN CHAT AREA ── -->
    <div id="chatMain">

      <!-- Active Chat Header -->
      <header>
        <div class="header-left" onclick="BestieChat.openProfile()">
          <button type="button" class="header-back-btn" onclick="event.stopPropagation(); BestieChat.toggleSidebar();" title="Back to Chats">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
          </button>
          <div id="headerBestieAvatar" class="header-avatar">B</div>
          <div class="header-details">
            <div id="headerBestieName" class="header-title">Select a Chat</div>
            <div id="headerBestieStatus" class="header-subtitle">Online</div>
          </div>
        </div>

        <div class="header-actions">
          <button type="button" class="icon-btn" onclick="BestieChat.startCall('audio')" title="Voice Call">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" onclick="BestieChat.startCall('video')" title="Video Call">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" onclick="BestieChat.deleteRoom()" title="Clear Chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Messages Viewport -->
      <div id="messages"></div>

      <!-- Reply Bar -->
      <div id="replyBar">
        <div class="reply-bar-text">
          <span style="font-weight:700;">Replying to: </span>
          <span id="replyPreviewText"></span>
        </div>
        <button type="button" onclick="BestieChat.cancelReply()" style="color:#ffffff; font-size:14px; padding:4px;">✕</button>
      </div>

      <!-- Recording Bar -->
      <div id="recordingWaveformBar">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:10px; height:10px; border-radius:50%; background:#ffffff;"></span>
          <span id="recordingTimer" style="font-size:13px; font-weight:700; color:#ffffff;">0:00</span>
        </div>
        <div style="font-size:12px; color:var(--muted);">Recording voice note...</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <button type="button" onclick="BestieChat.cancelRecording()" style="color:#ffffff; font-size:13px; font-weight:600; padding:4px 8px; border:1px solid var(--border); border-radius:6px;">Cancel</button>
          <button type="button" onclick="BestieChat.toggleRecord()" style="background:#ffffff; color:#000000; font-weight:700; border-radius:6px; padding:4px 12px; font-size:13px;">Send</button>
        </div>
      </div>

      <!-- Attachment Dropdown -->
      <div id="attachMenu" class="attach-menu" style="display:none;">
        <label class="attach-item" title="Photos">
          <span class="attach-icon">📷</span>
          <span class="attach-label">Photo</span>
          <input type="file" id="photoInput" accept="image/*,video/*" multiple style="display:none;" onchange="BestieChat.sendPhoto(this.files)" />
        </label>
        <label class="attach-item" title="Documents">
          <span class="attach-icon">📄</span>
          <span class="attach-label">Document</span>
          <input type="file" id="docInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.zip" style="display:none;" onchange="BestieChat.uploadDocumentFile(this)" />
        </label>
        <label class="attach-item" title="Camera">
          <span class="attach-icon">📸</span>
          <span class="attach-label">Camera</span>
          <input type="file" id="cameraFileInput" accept="image/*" capture="environment" style="display:none;" onchange="BestieChat.uploadCameraFile(this)" />
        </label>
      </div>

      <!-- Emoji Picker -->
      <div id="emojiPicker"></div>

      <!-- Bottom Input Dock -->
      <div id="inputBarContainer">
        <div class="input-pill">
          <button type="button" class="pill-btn" onclick="BestieChat.toggleEmojiPicker()" title="Emoji">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>
            </svg>
          </button>
          <button type="button" class="pill-btn" onclick="BestieChat.toggleAttachMenu()" title="Attach file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <textarea id="msgInput" rows="1" placeholder="Write a message..." autocomplete="off" maxlength="2000"></textarea>
        </div>

        <!-- Send / Mic Button -->
        <button id="sendBtn" type="button" onclick="BestieChat.handleSendBtnClick()" title="Send Message">
          <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <svg id="micIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- ═══════════════════ MODALS ═══════════════════ -->

  <!-- New Chat Modal -->
  <div id="newChatModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) BestieChat.closeNewChatModal()">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">New Conversation</h3>
        <button type="button" class="modal-close" onclick="BestieChat.closeNewChatModal()">✕</button>
      </div>
      <input id="newChatSearch" type="text" class="login-input" placeholder="Type username or name to search..." oninput="BestieChat.searchUsersForDM(this.value)" autocomplete="off" />
      <div id="newChatResults" style="display:flex; flex-direction:column; gap:6px; max-height:300px; overflow-y:auto;"></div>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this) BestieChat.closeProfile()">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">My Profile</h3>
        <button type="button" class="modal-close" onclick="BestieChat.closeProfile()">✕</button>
      </div>
      <div class="login-field">
        <label class="login-label" for="profileNickname">Display Name</label>
        <input id="profileNickname" type="text" class="login-input" placeholder="Your name..." />
      </div>
      <div class="login-field">
        <label class="login-label" for="profileStatus">Status</label>
        <input id="profileStatus" type="text" class="login-input" placeholder="e.g. Available, At work..." />
      </div>
      <button type="button" class="login-btn" onclick="BestieChat.saveProfile()">Save Changes</button>
    </div>
  </div>

  <!-- Call Overlay -->
  <div id="callOverlay">
    <div id="callRemoteVideoWrap" style="position:relative; width:100%; max-width:480px; height:280px; background:#111; border-radius:12px; overflow:hidden; display:none;">
      <video id="callRemoteVideo" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
      <video id="callLocalVideo" autoplay playsinline muted style="position:absolute; bottom:12px; right:12px; width:90px; height:120px; border-radius:8px; object-fit:cover; border:2px solid #fff;"></video>
    </div>
    <div id="callUserSection" style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px;">
      <div id="callAvatar" class="call-user-avatar">C</div>
      <h2 id="callUserName" style="font-size:22px; font-weight:700; color:#fff;">Calling...</h2>
      <p id="callStatus" style="font-size:14px; color:var(--muted);">Connecting...</p>
    </div>
    <div class="call-controls">
      <button type="button" id="muteAudioBtn" class="call-btn action" onclick="BestieChat.toggleMuteAudio()" title="Mute Mic">Mute</button>
      <button type="button" id="toggleCamBtn" class="call-btn action" onclick="BestieChat.toggleCamera()" title="Toggle Camera">Camera</button>
      <button type="button" class="call-btn decline" onclick="BestieChat.endCall()" title="End Call">End</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=6000"></script>
</body>
</html>
